name: Build Slate APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: Collect APK
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/slate.apk || true
          tail -60 build.log > out/build-tail.txt || true
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slate-apk
          path: out/
      # Always-current download link:
      # https://github.com/emayushp/slate-apk/releases/latest/download/slate.apk
      - name: Publish latest release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Slate (latest build)
          files: out/slate.apk
          make_latest: true
