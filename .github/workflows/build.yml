name: Build Slate APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk slate.apk

      - uses: actions/upload-artifact@v4
        with:
          name: slate-apk
          path: slate.apk

      # Publishes slate.apk as the "latest" release, so it's always at
      # https://github.com/<you>/<repo>/releases/latest/download/slate.apk
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Slate (latest build)
          files: slate.apk
          make_latest: true
